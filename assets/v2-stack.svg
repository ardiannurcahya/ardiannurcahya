      <g transform="translate(0, 30)">
        <rect class="chip" width="158" height="24"/>
        <text class="item-text" x="10" y="16">AI Routing Gateway</text>
      </g>
      <g transform="translate(0, 60)">
        <rect class="chip" width="158" height="24"/>
        <text class="item-text" x="10" y="16">GraphDB &amp; Neo4j</text>
      </g>
      <g transform="translate(0, 90)">
        <rect class="chip" width="158" height="24"/>
        <text class="item-text" x="10" y="16">PostgreSQL</text>
      </g>
      <g transform="translate(0, 120)">
        <rect class="chip" width="158" height="24"/>
