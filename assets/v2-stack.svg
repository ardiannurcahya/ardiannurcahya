    <g transform="translate(14, 44)">
      <g transform="translate(0, 0)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">Knowledge Graphs</text>
      </g>
      <g transform="translate(0, 34)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">Temporal Graph Store</text>
      </g>
      <g transform="translate(0, 68)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">Vector DBs (Qdrant)</text>
      </g>
      <g transform="translate(0, 102)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">LLM Agent Skills</text>
      </g>
      <g transform="translate(0, 136)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">Graph RAG Systems</text>
      </g>
      <g transform="translate(0, 170)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">MCP Server Protocol</text>
      </g>
    </g>
  </g>

  <!-- Column 3: Backend & Data -->
  <g transform="translate(424, 52)">
    <rect class="panel-col" width="190" height="258"/>
    <g transform="translate(14, 22)">
      <circle cx="0" cy="0" r="3" fill="#ff9f0a"/>
      <text class="col-title" x="10" y="4">03. BACKEND &amp; DATA</text>
