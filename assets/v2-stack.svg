        <text class="item-text" x="10" y="16">K3s Multinode</text>
      </g>
      <g transform="translate(0, 30)">
        <rect class="chip" width="148" height="24"/>
        <text class="item-text" x="10" y="16">Docker Container</text>
      </g>
      <g transform="translate(0, 60)">
        <rect class="chip" width="148" height="24"/>
        <text class="item-text" x="10" y="16">GitHub Actions CI</text>
      </g>
      <g transform="translate(0, 90)">
        <rect class="chip" width="148" height="24"/>
        <text class="item-text" x="10" y="16">Nginx Proxy</text>
      </g>
      <g transform="translate(0, 120)">
        <rect class="chip" width="148" height="24"/>
        <text class="item-text" x="10" y="16">Playwright Bot</text>
      </g>
      <g transform="translate(0, 150)">
