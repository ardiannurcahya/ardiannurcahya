<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" fill="none" role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">Ardian Nurcahya - Technology Stack Symbols</title>
  <desc id="stack-desc">Dark glassmorphic window with animated aurora background displaying vector symbols and icons for core engineering technologies.</desc>
  <defs>
    <!-- Background Glass Base -->
    <linearGradient id="glass-base-stack" x1="0" y1="0" x2="840" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10131e" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#0a0c14" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Animated Border Gradient Stroke -->
    <linearGradient id="border-beam-stack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient Aurora Orbs -->
    <radialGradient id="aurora-stack-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora-stack-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#7e22ce" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora-stack-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- Header Frosted Glass Gradient -->
    <linearGradient id="header-glass-stack" x1="0" y1="0" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Panel Column Glass Gradient -->
    <linearGradient id="panel-glass-grad" x1="0" y1="0" x2="0" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="panel-stroke-grad" x1="0" y1="0" x2="190" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Chip Glass Gradients -->
    <linearGradient id="chip-glass" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="chip-stroke" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Traffic Lights -->
    <linearGradient id="btn-red-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b62"/>
      <stop offset="100%" stop-color="#ea3e36"/>
    </linearGradient>
    <linearGradient id="btn-yellow-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd043"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="btn-green-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fe25e"/>
      <stop offset="100%" stop-color="#1db939"/>
    </linearGradient>

    <!-- Filter Shadow -->
    <filter id="stack-shadow" x="-5%" y="-5%" width="110%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes auroraMove1 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.65; }
      33% { transform: translate(80px, 20px) scale(1.2); opacity: 0.9; }
      66% { transform: translate(-40px, -20px) scale(0.85); opacity: 0.55; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.65; }
    }
    @keyframes auroraMove2 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.6; }
      33% { transform: translate(-60px, -25px) scale(1.15); opacity: 0.85; }
      66% { transform: translate(50px, 30px) scale(0.9); opacity: 0.5; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.6; }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.95; transform: scale(1.3); }
    }

    .aurora-s1 { animation: auroraMove1 11s ease-in-out infinite; }
    .aurora-s2 { animation: auroraMove2 13s ease-in-out infinite; }
    .star-1 { animation: starTwinkle 3s ease-in-out infinite; }
    .star-2 { animation: starTwinkle 4s ease-in-out infinite 1.2s; }
    .star-3 { animation: starTwinkle 3.6s ease-in-out infinite 0.6s; }

    .window-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.4px;
      fill: #94a3b8;
    }
    .col-title {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #cbd5e1;
    }
    .panel-col {
      fill: url(#panel-glass-grad);
      stroke: url(#panel-stroke-grad);
      stroke-width: 1;
      rx: 10;
    }
    .icon-chip {
      fill: url(#chip-glass);
      stroke: url(#chip-stroke);
      stroke-width: 1;
      rx: 7;
    }
    .chip-name {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.1px;
      fill: #cbd5e1;
      text-anchor: middle;
    }
    @media (prefers-color-scheme: light) {
      .win-bg { fill: #f8fafc; stroke: #cbd5e1; }
      .win-header { fill: #f1f5f9; stroke: #e2e8f0; }
      .window-title { fill: #475569; }
      .panel-col { fill: #f8fafc; stroke: #e2e8f0; }
      .icon-chip { fill: #ffffff; stroke: #e2e8f0; }
      .chip-name { fill: #475569; }
      .col-title { fill: #0f172a; }
      .divider { stroke: #e2e8f0; }
    }
  </style>

  <!-- Window Base with Deep Drop Shadow -->
  <rect class="win-bg" x="2" y="2" width="836" height="256" rx="16" fill="url(#glass-base-stack)" stroke="url(#border-beam-stack)" stroke-width="1.4" filter="url(#stack-shadow)"/>

  <!-- Clip Path for Internal Animated Aurora -->
  <clipPath id="stack-glass-clip">
    <rect x="3" y="3" width="834" height="254" rx="15"/>
  </clipPath>

  <g clip-path="url(#stack-glass-clip)">
    <!-- Animated Aurora Glows -->
    <g class="aurora-s1">
      <circle cx="150" cy="80" r="180" fill="url(#aurora-stack-cyan)"/>
    </g>
    <g class="aurora-s2">
      <circle cx="720" cy="180" r="190" fill="url(#aurora-stack-purple)"/>
    </g>
    <g class="aurora-s1">
      <circle cx="430" cy="120" r="150" fill="url(#aurora-stack-emerald)"/>
    </g>

    <!-- Star Twinkles -->
    <g class="star-1" transform="translate(110, 30)"><circle cx="0" cy="0" r="1.5" fill="#38bdf8"/><circle cx="0" cy="0" r="3.5" fill="#38bdf8" fill-opacity="0.3"/></g>
    <g class="star-2" transform="translate(560, 32)"><circle cx="0" cy="0" r="1.8" fill="#a855f7"/><circle cx="0" cy="0" r="4" fill="#a855f7" fill-opacity="0.3"/></g>
    <g class="star-3" transform="translate(790, 40)"><circle cx="0" cy="0" r="1.4" fill="#34d399"/><circle cx="0" cy="0" r="3" fill="#34d399" fill-opacity="0.3"/></g>
  </g>

  <!-- Frosted Titlebar Header -->
  <path class="win-header" d="M 2 16 C 2 8.27 8.27 2 16 2 L 824 2 C 831.73 2 838 8.27 838 16 L 838 38 L 2 38 Z" fill="url(#header-glass-stack)"/>
  <line class="divider" x1="2" y1="38" x2="838" y2="38" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Glossy Traffic Light Window Controls -->
  <g transform="translate(18, 13)">
    <circle cx="6" cy="6" r="5.5" fill="url(#btn-red-s)"/>
    <circle cx="6" cy="6" r="5.5" stroke="#d63029" stroke-width="0.6" fill="none"/>
    <circle cx="23" cy="6" r="5.5" fill="url(#btn-yellow-s)"/>
    <circle cx="23" cy="6" r="5.5" stroke="#d48d17" stroke-width="0.6" fill="none"/>
    <circle cx="40" cy="6" r="5.5" fill="url(#btn-green-s)"/>
    <circle cx="40" cy="6" r="5.5" stroke="#189e30" stroke-width="0.6" fill="none"/>
  </g>

  <!-- Centered Window Title -->
  <text class="window-title" x="420" y="23.5" text-anchor="middle">tech-arsenal — vector symbols</text>

  <!-- Column 1: Core Languages (6 icons) -->
  <g transform="translate(24, 48)">
    <rect class="panel-col" width="190" height="194"/>
    <text class="col-title" x="14" y="23">LANGUAGES</text>
    
    <!-- Row 1: Go, Python, TypeScript -->
    <g transform="translate(14, 36)">
      <!-- Go Icon -->
      <g transform="translate(0, 0)">
        <rect class="icon-chip" width="48" height="48"/>
        <path d="M 12 28 C 12 20 16 16 24 16 C 30 16 34 19 35 23 L 30 24 C 29 21 27 19 24 19 C 19 19 16 22 16 28 C 16 34 19 37 24 37 C 27 37 29 35 30 32 L 23 32 L 23 29 L 36 29 L 36 34 C 33 38 29 40 24 40 C 16 40 12 36 12 28 Z" fill="#00ADD8"/>
        <text class="chip-name" x="24" y="61">Go</text>
      </g>

      <!-- Python Icon -->
      <g transform="translate(56, 0)">
        <rect class="icon-chip" width="48" height="48"/>
        <path d="M 23 14 C 18 14 15 16 15 19 L 15 22 L 24 22 L 24 23 L 13 23 C 10 23 8 26 8 29 C 8 33 11 35 15 35 L 17 35 L 17 32 C 17 29 20 27 23 27 L 30 27 C 32 27 34 25 34 23 L 34 19 C 34 16 31 14 26 14 L 23 14 Z M 20 17 A 1.5 1.5 0 1 1 20 16.9 Z" fill="#3776AB"/>
        <path d="M 25 38 C 30 38 33 36 33 33 L 33 30 L 24 30 L 24 29 L 35 29 C 38 29 40 26 40 23 C 40 19 37 17 33 17 L 31 17 L 31 20 C 31 23 28 25 25 25 L 18 25 C 16 25 14 27 14 29 L 14 33 C 14 36 17 38 22 38 L 25 38 Z M 28 35 A 1.5 1.5 0 1 1 28 34.9 Z" fill="#FFD43B"/>
        <text class="chip-name" x="24" y="61">Python</text>
      </g>

      <!-- TypeScript Icon -->
      <g transform="translate(112, 0)">
        <rect class="icon-chip" width="48" height="48"/>
        <rect x="10" y="10" width="28" height="28" rx="4" fill="#3178c6"/>
        <path d="M 14 18 L 26 18 M 20 18 L 20 32" stroke="#ffffff" stroke-width="2" stroke-linecap="square"/>
        <path d="M 33 21 C 31 19 28 20 28 22 C 28 26 34 25 34 29 C 34 33 29 33 27 31" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text class="chip-name" x="24" y="61">TS</text>
      </g>
    </g>

    <!-- Row 2: JavaScript, SQL, Bash -->
    <g transform="translate(14, 110)">
      <!-- JavaScript Icon -->
      <g transform="translate(0, 0)">
        <rect class="icon-chip" width="48" height="48"/>
        <rect x="10" y="10" width="28" height="28" rx="4" fill="#f7df1e"/>
        <path d="M 21 27 L 21 32 C 21 34 18 34 17 33" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 33 23 C 31 21 28 22 28 24 C 28 28 34 27 34 30 C 34 33 30 33 28 32" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text class="chip-name" x="24" y="61">JS</text>
      </g>

      <!-- SQL Icon -->
      <g transform="translate(56, 0)">
        <rect class="icon-chip" width="48" height="48"/>
        <ellipse cx="24" cy="17" rx="14" ry="5" fill="#4479A1"/>
        <path d="M 10 17 L 10 31 C 10 34 16 36 24 36 C 32 36 38 34 38 31 L 38 17" fill="none" stroke="#4479A1" stroke-width="2"/>
        <path d="M 10 24 C 10 27 16 29 24 29 C 32 29 38 27 38 24" fill="none" stroke="#4479A1" stroke-width="1.8"/>
        <text class="chip-name" x="24" y="61">SQL</text>
      </g>

      <!-- Bash Icon -->
      <g transform="translate(112, 0)">
        <rect class="icon-chip" width="48" height="48"/>
        <path d="M 14 18 L 22 24 L 14 30" stroke="#4EAA25" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="24" y1="30" x2="34" y2="30" stroke="#4EAA25" stroke-width="2.5" stroke-linecap="round"/>
        <text class="chip-name" x="24" y="61">Bash</text>
      </g>
    </g>
  </g>

  <!-- Column 2: Agent Memory & Graphs (4 icons) -->
  <g transform="translate(224, 48)">
    <rect class="panel-col" width="190" height="194"/>
    <text class="col-title" x="14" y="23">AGENT &amp; MEMORY</text>

    <!-- Row 1: Graph RAG, Vector DB -->
    <g transform="translate(24, 36)">
      <!-- Knowledge Graph Icon -->
      <g transform="translate(0, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <circle cx="21" cy="20" r="4.5" fill="#34d399"/>
        <circle cx="41" cy="18" r="4.5" fill="#38bdf8"/>
        <circle cx="31" cy="34" r="4.5" fill="#fbbf24"/>
        <line x1="21" y1="20" x2="41" y2="18" stroke="#71717a" stroke-width="1.5"/>
        <line x1="21" y1="20" x2="31" y2="34" stroke="#71717a" stroke-width="1.5"/>
        <line x1="41" y1="18" x2="31" y2="34" stroke="#71717a" stroke-width="1.5"/>
        <text class="chip-name" x="31" y="61">Graph RAG</text>
      </g>

      <!-- Vector DB Icon -->
      <g transform="translate(76, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <polygon points="31,14 44,21 31,28 18,21" fill="#ec4899" fill-opacity="0.85"/>
        <polygon points="18,21 31,28 31,38 18,31" fill="#be185d"/>
        <polygon points="44,21 31,28 31,38 44,31" fill="#f43f5e"/>
        <text class="chip-name" x="31" y="61">Vector DB</text>
      </g>
    </g>

    <!-- Row 2: PyTorch, MCP Agent -->
    <g transform="translate(24, 110)">
      <!-- PyTorch Flame Icon -->
      <g transform="translate(0, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <path d="M 33 14 C 33 14 36 17 36 21 C 36 26 31 28 31 31 C 31 33 33 35 33 35 C 33 35 24 34 24 26 C 24 21 28 17 33 14 Z" fill="#EE4C2C"/>
        <circle cx="35" cy="15" r="1.5" fill="#EE4C2C"/>
        <text class="chip-name" x="31" y="61">PyTorch</text>
      </g>

      <!-- MCP Protocol Icon -->
      <g transform="translate(76, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <circle cx="23" cy="24" r="5" fill="#38bdf8"/>
        <circle cx="39" cy="24" r="5" fill="#34d399"/>
        <path d="M 28 24 L 34 24" stroke="#ffffff" stroke-width="2"/>
        <circle cx="31" cy="15" r="3" fill="#a1a1aa"/>
        <line x1="31" y1="18" x2="31" y2="24" stroke="#a1a1aa" stroke-width="1.5"/>
        <text class="chip-name" x="31" y="61">MCP Skills</text>
      </g>
    </g>
  </g>

  <!-- Column 3: Backend & Data (4 icons) -->
  <g transform="translate(424, 48)">
    <rect class="panel-col" width="190" height="194"/>
    <text class="col-title" x="14" y="23">BACKEND &amp; DATA</text>

    <!-- Row 1: FastAPI, PostgreSQL -->
    <g transform="translate(24, 36)">
      <!-- FastAPI Bolt Icon -->
      <g transform="translate(0, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <circle cx="31" cy="24" r="14" fill="#009688"/>
        <polygon points="32,13 25,24 30,24 28,35 37,22 32,22" fill="#ffffff"/>
        <text class="chip-name" x="31" y="61">FastAPI</text>
      </g>

      <!-- PostgreSQL Elephant/DB Icon -->
      <g transform="translate(76, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <circle cx="31" cy="24" r="14" fill="#336791"/>
        <path d="M 24 20 C 24 16 38 16 38 24 C 38 29 33 32 30 32 L 28 32 L 28 24 C 28 20 24 20 24 20 Z" fill="#ffffff"/>
        <text class="chip-name" x="31" y="61">Postgres</text>
      </g>
    </g>

    <!-- Row 2: Redis, GraphDB -->
    <g transform="translate(24, 110)">
      <!-- Redis Icon -->
      <g transform="translate(0, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <polygon points="31,14 45,21 31,28 17,21" fill="#DC382D"/>
        <polygon points="17,23 31,30 31,37 17,30" fill="#A82319"/>
        <polygon points="45,23 31,30 31,37 45,30" fill="#DC382D"/>
        <text class="chip-name" x="31" y="61">Redis</text>
      </g>

      <!-- Neo4j GraphDB Icon -->
      <g transform="translate(76, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <circle cx="31" cy="24" r="14" fill="#008CC1"/>
        <circle cx="26" cy="22" r="3" fill="#ffffff"/>
        <circle cx="36" cy="22" r="3" fill="#ffffff"/>
        <circle cx="31" cy="30" r="3" fill="#ffffff"/>
        <line x1="26" y1="22" x2="36" y2="22" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="26" y1="22" x2="31" y2="30" stroke="#ffffff" stroke-width="1.2"/>
        <text class="chip-name" x="31" y="61">GraphDB</text>
      </g>
    </g>
  </g>

  <!-- Column 4: Cluster & Ops (4 icons) -->
  <g transform="translate(624, 48)">
    <rect class="panel-col" width="190" height="194"/>
    <text class="col-title" x="14" y="23">CLUSTER &amp; OPS</text>

    <!-- Row 1: Kubernetes, Docker -->
    <g transform="translate(24, 36)">
      <!-- Kubernetes Helm Icon -->
      <g transform="translate(0, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <circle cx="31" cy="24" r="14" fill="#326CE5"/>
        <polygon points="31,15 38,19 38,29 31,33 24,29 24,19" fill="#ffffff"/>
        <circle cx="31" cy="24" r="3" fill="#326CE5"/>
        <text class="chip-name" x="31" y="61">K3s / K8s</text>
      </g>

      <!-- Docker Whale Icon -->
      <g transform="translate(76, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <circle cx="31" cy="24" r="14" fill="#2496ED"/>
        <rect x="23" y="20" width="3" height="3" fill="#ffffff"/>
        <rect x="27" y="20" width="3" height="3" fill="#ffffff"/>
        <rect x="31" y="20" width="3" height="3" fill="#ffffff"/>
        <rect x="27" y="16" width="3" height="3" fill="#ffffff"/>
        <path d="M 20 25 C 20 31 38 31 41 26 C 39 24 35 24 32 25 L 20 25 Z" fill="#ffffff"/>
        <text class="chip-name" x="31" y="61">Docker</text>
      </g>
    </g>

    <!-- Row 2: GitHub Actions, Nginx -->
    <g transform="translate(24, 110)">
      <!-- GitHub Actions Pipeline Icon -->
      <g transform="translate(0, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <circle cx="31" cy="24" r="14" fill="#2088FF"/>
        <circle cx="25" cy="24" r="2.5" fill="#ffffff"/>
        <circle cx="37" cy="19" r="2.5" fill="#ffffff"/>
        <circle cx="37" cy="29" r="2.5" fill="#ffffff"/>
        <path d="M 25 24 L 37 19 M 25 24 L 37 29" stroke="#ffffff" stroke-width="1.5"/>
        <text class="chip-name" x="31" y="61">Github Actions</text>
      </g>

      <!-- Nginx Hexagon Icon -->
      <g transform="translate(76, 0)">
        <rect class="icon-chip" width="62" height="48"/>
        <circle cx="31" cy="24" r="14" fill="#009639"/>
        <path d="M 26 31 L 26 17 L 36 31 L 36 17" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text class="chip-name" x="31" y="61">Nginx</text>
      </g>
    </g>
  </g>
</svg>
