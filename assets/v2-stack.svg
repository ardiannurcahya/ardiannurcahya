<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" fill="none" role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">Ardian Nurcahya - Precision Technical Architecture</title>
  <desc id="stack-desc">Technical stack across core languages, agent memory and graphs, backend routing, and cluster infrastructure.</desc>
  <style>
    .sec-header {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #10b981;
    }
    .col-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #f4f4f5;
    }
    .item-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 500;
      fill: #a1a1aa;
    }
    .corner-tick {
      fill: #52525b;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      font-weight: 700;
    }
    .panel-col {
      fill: #12131a;
      stroke: #27272a;
      stroke-width: 1;
      rx: 6;
    }
    .chip {
      fill: #1c202a;
      stroke: #27272a;
      stroke-width: 1;
      rx: 4;
    }
    @media (prefers-color-scheme: light) {
      .card-bg { fill: #f8fafc; stroke: #e2e8f0; }
      .panel-col { fill: #ffffff; stroke: #e2e8f0; }
      .chip { fill: #f1f5f9; stroke: #cbd5e1; }
      .sec-header { fill: #059669; }
      .col-title { fill: #09090b; }
      .item-text { fill: #334155; }
    }
