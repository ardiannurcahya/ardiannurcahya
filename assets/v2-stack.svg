<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" fill="none" role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">Ardian Nurcahya - macOS Tech Matrix</title>
  <desc id="stack-desc">Dark macOS style window showcasing Ardian's full technical architecture and engineering skills.</desc>
  <style>
    .window-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #86868b;
    }
    .col-title {
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #f5f5f7;
    }
    .item-text {
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #a1a1a6;
    }
    .panel-col {
      fill: #161820;
      stroke: #262933;
      stroke-width: 1;
      rx: 6;
    }
    .chip {
      fill: #1d202b;
      stroke: #2c2f3d;
      stroke-width: 1;
      rx: 4;
    }
    @media (prefers-color-scheme: light) {
      .win-bg { fill: #ffffff; stroke: #d1d5db; }
      .win-header { fill: #f3f4f6; stroke: #e5e7eb; }
      .window-title { fill: #4b5563; }
      .panel-col { fill: #f9fafb; stroke: #e5e7eb; }
      .chip { fill: #ffffff; stroke: #e5e7eb; }
      .col-title { fill: #111827; }
      .item-text { fill: #4b5563; }
      .divider { stroke: #e5e7eb; }
    }
  </style>

  <!-- Window Base -->
  <rect class="win-bg" x="1" y="1" width="838" height="328" rx="10" fill="#121319" stroke="#2d3139" stroke-width="1.5"/>

  <!-- macOS Titlebar Header -->
  <path class="win-header" d="M 1 11 C 1 5.5 5.5 1 11 1 L 829 1 C 834.5 1 839 5.5 839 11 L 839 36 L 1 36 Z" fill="#1c1e26"/>
  <line class="divider" x1="1" y1="36" x2="839" y2="36" stroke="#262833" stroke-width="1"/>

  <!-- macOS Traffic Light Buttons -->
  <circle cx="20" cy="18" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.8"/>
  <circle cx="36" cy="18" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.8"/>
  <circle cx="52" cy="18" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.8"/>

  <!-- Window Title -->
  <text class="window-title" x="420" y="22" text-anchor="middle">architecture-stack.yaml — 4 modules</text>

  <!-- Column 1: Core Languages -->
  <g transform="translate(24, 52)">
    <rect class="panel-col" width="186" height="258"/>
    <g transform="translate(14, 22)">
      <circle cx="0" cy="0" r="3" fill="#30d158"/>
      <text class="col-title" x="10" y="4">01. LANGUAGES</text>
    </g>
    <g transform="translate(14, 44)">
      <g transform="translate(0, 0)">
        <rect class="chip" width="158" height="26"/>
        <circle cx="12" cy="13" r="3" fill="#00ADD8"/>
        <text class="item-text" x="24" y="17">Go (Golang)</text>
      </g>
      <g transform="translate(0, 34)">
        <rect class="chip" width="158" height="26"/>
        <circle cx="12" cy="13" r="3" fill="#3776AB"/>
        <text class="item-text" x="24" y="17">Python</text>
      </g>
      <g transform="translate(0, 68)">
        <rect class="chip" width="158" height="26"/>
        <circle cx="12" cy="13" r="3" fill="#3178c6"/>
        <text class="item-text" x="24" y="17">TypeScript</text>
      </g>
      <g transform="translate(0, 102)">
        <rect class="chip" width="158" height="26"/>
        <circle cx="12" cy="13" r="3" fill="#f1e05a"/>
        <text class="item-text" x="24" y="17">JavaScript</text>
      </g>
      <g transform="translate(0, 136)">
        <rect class="chip" width="158" height="26"/>
        <circle cx="12" cy="13" r="3" fill="#4479A1"/>
        <text class="item-text" x="24" y="17">SQL (Postgres)</text>
      </g>
      <g transform="translate(0, 170)">
        <rect class="chip" width="158" height="26"/>
        <circle cx="12" cy="13" r="3" fill="#4EAA25"/>
        <text class="item-text" x="24" y="17">Bash Shell</text>
      </g>
    </g>
  </g>

  <!-- Column 2: Agent Memory & Graphs -->
  <g transform="translate(222, 52)">
    <rect class="panel-col" width="190" height="258"/>
    <g transform="translate(14, 22)">
      <circle cx="0" cy="0" r="3" fill="#64d2ff"/>
      <text class="col-title" x="10" y="4">02. AGENT MEMORY</text>
