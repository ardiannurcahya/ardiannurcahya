    <g transform="translate(14, 44)">
      <g transform="translate(0, 0)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">FastAPI Services</text>
      </g>
      <g transform="translate(0, 34)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">AI Routing Gateway</text>
      </g>
      <g transform="translate(0, 68)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">GraphDB &amp; Neo4j</text>
      </g>
      <g transform="translate(0, 102)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">PostgreSQL</text>
      </g>
      <g transform="translate(0, 136)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">Redis Cache/Queue</text>
      </g>
      <g transform="translate(0, 170)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">OpenAI-Compat APIs</text>
      </g>
    </g>
  </g>

  <!-- Column 4: Infrastructure & Ops -->
  <g transform="translate(626, 52)">
    <rect class="panel-col" width="190" height="258"/>
    <g transform="translate(14, 22)">
      <circle cx="0" cy="0" r="3" fill="#a1a1a6"/>
      <text class="col-title" x="10" y="4">04. CLUSTER &amp; OPS</text>
    </g>
    <g transform="translate(14, 44)">
      <g transform="translate(0, 0)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">K3s Multinode</text>
      </g>
      <g transform="translate(0, 34)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">Docker Engine</text>
      </g>
      <g transform="translate(0, 68)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">GitHub Actions CI</text>
      </g>
      <g transform="translate(0, 102)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">Nginx Reverse Proxy</text>
      </g>
      <g transform="translate(0, 136)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">Playwright Bot</text>
      </g>
      <g transform="translate(0, 170)">
        <rect class="chip" width="162" height="26"/>
        <text class="item-text" x="12" y="17">Linux VPS Admin</text>
      </g>
    </g>
