<svg xmlns="http://www.w3.org/2000/svg" width="410" height="215" viewBox="0 0 410 215" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">LANGUAGE_METRICS</title>
  <desc id="desc">Top programming languages by code volume across public non-fork repositories.</desc>
  <style>
    .title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 0.5px; fill: #10b981; }
    .meta { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #71717a; }
    .label { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #a1a1aa; }
    .value { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #f4f4f5; }
    .rank-badge { font: 800 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #10b981; }
    .text { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #e4e4e7; }
    .corner-tick { fill: #52525b; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; }
    @media (prefers-color-scheme: light) {
      .card-bg { fill: #f8fafc; stroke: #e2e8f0; }
      .title { fill: #059669; }
      .label { fill: #64748b; }
      .value { fill: #09090b; }
      .rank-badge { fill: #059669; }
      .text { fill: #1e293b; }
      .divider { stroke: #e2e8f0; }
      .pill-bg { fill: #f1f5f9; stroke: #cbd5e1; }
    }
  </style>

  <rect class="card-bg" x="1" y="1" width="408" height="213" rx="8" fill="#090a0f" stroke="#27272a" stroke-width="1.5"/>

  <!-- Corner Crosshairs -->
  <text class="corner-tick" x="10" y="18">+</text>
  <text class="corner-tick" x="392" y="18">+</text>
  <text class="corner-tick" x="10" y="206">+</text>
  <text class="corner-tick" x="392" y="206">+</text>

  <!-- Card Header -->
  <g transform="translate(24, 28)">
    <circle cx="0" cy="0" r="3" fill="#10b981"/>
    <text x="10" y="4" class="title">LANGUAGE_METRICS</text>
    <text x="360" y="4" text-anchor="end" class="meta">CODE_VOLUME</text>
  </g>

  <rect x="24" y="52" width="362" height="6" rx="3" fill="#18181b"/>
  <rect x="24.00" y="52" width="139.19" height="6" fill="#3776AB"/>
  <rect x="163.19" y="52" width="78.60" height="6" fill="#00ADD8"/>
  <rect x="241.79" y="52" width="65.68" height="6" fill="#DA5B0B"/>
  <rect x="307.46" y="52" width="36.26" height="6" fill="#f1e05a"/>
  <rect x="343.72" y="52" width="26.16" height="6" fill="#3178c6"/>
  <circle cx="28" cy="84" r="3.5" fill="#3776AB"/>
  <text x="42" y="88" class="text">Python</text>
  <text x="386" y="88" text-anchor="end" class="label">38.4%</text>
  <circle cx="28" cy="108" r="3.5" fill="#00ADD8"/>
  <text x="42" y="112" class="text">Go</text>
  <text x="386" y="112" text-anchor="end" class="label">21.7%</text>
  <circle cx="28" cy="132" r="3.5" fill="#DA5B0B"/>
  <text x="42" y="136" class="text">Jupyter Notebook</text>
  <text x="386" y="136" text-anchor="end" class="label">18.1%</text>
  <circle cx="28" cy="156" r="3.5" fill="#f1e05a"/>
  <text x="42" y="160" class="text">JavaScript</text>
  <text x="386" y="160" text-anchor="end" class="label">10.0%</text>
  <circle cx="28" cy="180" r="3.5" fill="#3178c6"/>
  <text x="42" y="184" class="text">TypeScript</text>
  <text x="386" y="184" text-anchor="end" class="label">7.2%</text>
</svg>
