<svg xmlns="http://www.w3.org/2000/svg" width="410" height="215" viewBox="0 0 410 215" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">language-distribution — analytics</title>
  <desc id="desc">Top programming languages by code volume across public non-fork repositories.</desc>
  <defs>
    <!-- Background Glass Gradients -->
    <linearGradient id="glass-base-w" x1="0" y1="0" x2="410" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141724" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0e1018" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#090a10" stop-opacity="0.99"/>
    </linearGradient>

    <linearGradient id="glass-stroke-w" x1="0" y1="0" x2="410" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Ambient Mesh Glow -->
    <radialGradient id="mesh-w-1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-w-2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <!-- Header Glass Gradient -->
    <linearGradient id="header-glass-w" x1="0" y1="0" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Traffic Lights -->
    <linearGradient id="btn-red-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b62"/>
      <stop offset="100%" stop-color="#ea3e36"/>
    </linearGradient>
    <linearGradient id="btn-yellow-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd043"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="btn-green-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fe25e"/>
      <stop offset="100%" stop-color="#1db939"/>
    </linearGradient>

    <!-- Filter Shadow -->
    <filter id="win-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .window-title { font: 500 11.5px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; fill: #8e8e93; letter-spacing: 0.3px; }
    .label { font: 500 12px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #a1a1aa; }
    .value { font: 700 14px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #f5f5f7; }
    .rank-badge { font: 800 13px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #34d399; }
    .text { font: 600 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; fill: #f5f5f7; }
    @media (prefers-color-scheme: light) {
      .win-bg { fill: #f8fafc; stroke: #cbd5e1; }
      .win-header { fill: #f1f5f9; stroke: #e2e8f0; }
      .window-title { fill: #475569; }
      .label { fill: #64748b; }
      .value { fill: #0f172a; }
      .rank-badge { fill: #059669; }
      .text { fill: #0f172a; }
      .divider { stroke: #e2e8f0; }
      .pill-bg { fill: #f1f5f9; stroke: #e2e8f0; }
    }
  </style>

  <!-- Window Container with Glass Elevation Shadow -->
  <rect class="win-bg" x="2" y="2" width="406" height="211" rx="14" fill="url(#glass-base-w)" stroke="url(#glass-stroke-w)" stroke-width="1.2" filter="url(#win-shadow)"/>
  <rect x="2" y="2" width="406" height="211" rx="14" fill="url(#mesh-w-1)"/>
  <rect x="2" y="2" width="406" height="211" rx="14" fill="url(#mesh-w-2)"/>

  <!-- Titlebar Header -->
  <path class="win-header" d="M 2 14 C 2 7.37 7.37 2 14 2 L 396 2 C 402.63 2 408 7.37 408 14 L 408 36 L 2 36 Z" fill="url(#header-glass-w)"/>
  <line class="divider" x1="2" y1="36" x2="408" y2="36" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Control Dots -->
  <g transform="translate(16, 12)">
    <circle cx="5" cy="5" r="5" fill="url(#btn-red-w)"/>
    <circle cx="5" cy="5" r="5" stroke="#d63029" stroke-width="0.5" fill="none"/>
    <circle cx="20" cy="5" r="5" fill="url(#btn-yellow-w)"/>
    <circle cx="20" cy="5" r="5" stroke="#d48d17" stroke-width="0.5" fill="none"/>
    <circle cx="35" cy="5" r="5" fill="url(#btn-green-w)"/>
    <circle cx="35" cy="5" r="5" stroke="#189e30" stroke-width="0.5" fill="none"/>
  </g>

  <!-- Centered Title -->
  <text class="window-title" x="205" y="22.5" text-anchor="middle">language-distribution — analytics</text>

  <rect x="24" y="52" width="362" height="7" rx="3.5" fill="#1b1e27"/>
  <rect x="24.00" y="52" width="139.91" height="7" fill="#3776AB"/>
  <rect x="163.91" y="52" width="79.18" height="7" fill="#00ADD8"/>
  <rect x="243.08" y="52" width="66.16" height="7" fill="#DA5B0B"/>
  <rect x="309.25" y="52" width="37.56" height="7" fill="#3178c6"/>
  <rect x="346.81" y="52" width="20.20" height="7" fill="#f1e05a"/>
  <circle cx="28" cy="84" r="3.5" fill="#3776AB"/>
  <text x="42" y="88" class="text">Python</text>
  <text x="386" y="88" text-anchor="end" class="label">38.6%</text>
  <circle cx="28" cy="108" r="3.5" fill="#00ADD8"/>
  <text x="42" y="112" class="text">Go</text>
  <text x="386" y="112" text-anchor="end" class="label">21.9%</text>
  <circle cx="28" cy="132" r="3.5" fill="#DA5B0B"/>
  <text x="42" y="136" class="text">Jupyter Notebook</text>
  <text x="386" y="136" text-anchor="end" class="label">18.3%</text>
  <circle cx="28" cy="156" r="3.5" fill="#3178c6"/>
  <text x="42" y="160" class="text">TypeScript</text>
  <text x="386" y="160" text-anchor="end" class="label">10.4%</text>
  <circle cx="28" cy="180" r="3.5" fill="#f1e05a"/>
  <text x="42" y="184" class="text">JavaScript</text>
  <text x="386" y="184" text-anchor="end" class="label">5.6%</text>
</svg>
