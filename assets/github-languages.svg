<svg xmlns="http://www.w3.org/2000/svg" width="410" height="215" viewBox="0 0 410 215" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Most Used Languages</title>
  <desc id="desc">Top programming languages by code volume across public non-fork repositories.</desc>
  <style>
    .title { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #38bdf8; }
    .label { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #8b949e; }
    .value { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #f0f6fc; }
    .rank-badge { font: 800 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #38bdf8; }
    .text { font: 600 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #c9d1d9; }
    @media (prefers-color-scheme: light) {
      .card-bg { fill: #f8fafc; stroke: #e2e8f0; }
      .title { fill: #0284c7; }
      .label { fill: #64748b; }
      .value { fill: #0f172a; }
      .rank-badge { fill: #0284c7; }
      .text { fill: #1e293b; }
      .divider { stroke: #e2e8f0; }
      .pill-bg { fill: #f1f5f9; }
    }
  </style>

  <defs>
    <linearGradient id="card-border" x1="0" y1="0" x2="410" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect class="card-bg" x="1" y="1" width="408" height="213" rx="12" fill="#0d1117" stroke="url(#card-border)" stroke-width="1.5"/>

  <!-- Card Header -->
  <g transform="translate(22, 28)">
    <circle cx="6" cy="6" r="4" fill="#818cf8"/>
    <text x="18" y="10" class="title">Most Used Languages</text>
  </g>

  <rect x="24" y="52" width="362" height="8" rx="4" fill="#21262d"/>
  <rect x="24.00" y="52" width="139.19" height="8" fill="#3572A5"/>
  <rect x="163.19" y="52" width="78.60" height="8" fill="#00ADD8"/>
  <rect x="241.79" y="52" width="65.68" height="8" fill="#DA5B0B"/>
  <rect x="307.46" y="52" width="36.26" height="8" fill="#f1e05a"/>
  <rect x="343.72" y="52" width="26.16" height="8" fill="#3178c6"/>
  <circle cx="28" cy="84" r="4.5" fill="#3572A5"/>
  <text x="42" y="88" class="text">Python</text>
  <text x="386" y="88" text-anchor="end" class="label">38.4%</text>
  <circle cx="28" cy="108" r="4.5" fill="#00ADD8"/>
  <text x="42" y="112" class="text">Go</text>
  <text x="386" y="112" text-anchor="end" class="label">21.7%</text>
  <circle cx="28" cy="132" r="4.5" fill="#DA5B0B"/>
  <text x="42" y="136" class="text">Jupyter Notebook</text>
  <text x="386" y="136" text-anchor="end" class="label">18.1%</text>
  <circle cx="28" cy="156" r="4.5" fill="#f1e05a"/>
  <text x="42" y="160" class="text">JavaScript</text>
  <text x="386" y="160" text-anchor="end" class="label">10.0%</text>
  <circle cx="28" cy="180" r="4.5" fill="#3178c6"/>
  <text x="42" y="184" class="text">TypeScript</text>
  <text x="386" y="184" text-anchor="end" class="label">7.2%</text>
</svg>
