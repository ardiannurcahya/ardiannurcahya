<svg xmlns="http://www.w3.org/2000/svg" width="840" height="375" viewBox="0 0 840 375" fill="none" role="img" aria-labelledby="terminal-title terminal-desc">
  <title id="terminal-title">Ardian Nurcahya - Terminal Profile</title>
  <desc id="terminal-desc">Interactive developer terminal showing Ardian's profile, focus areas, and engineering background.</desc>
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .term-header-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #94a3b8;
    }
    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13.5px;
      font-weight: 500;
    }
    .key { fill: #38bdf8; font-weight: 600; }
    .val-str { fill: #34d399; }
    .val-bullet { fill: #cbd5e1; }
    .val-accent { fill: #a78bfa; font-weight: 700; }
    .comment { fill: #64748b; font-style: italic; }
    .prompt { fill: #f43f5e; font-weight: 700; }
    .path { fill: #38bdf8; font-weight: 600; }
    .cmd { fill: #f1f5f9; font-weight: 600; }
    .output-text { fill: #94a3b8; }
    .cursor {
      fill: #38bdf8;
      animation: blink 1s infinite steps(2, start);
    }
    .l1 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 0.1s; }
    .l2 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 0.2s; }
    .l3 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 0.3s; }
    .l4 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 0.4s; }
    .l5 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 0.5s; }
    .l6 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 0.6s; }
    .l7 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 0.7s; }
    .l8 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 0.8s; }
    .l9 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 0.9s; }
    .l10 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 1.0s; }
    .l11 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 1.1s; }
    .l12 { opacity: 0; animation: fadeIn 0.25s ease-out forwards; animation-delay: 1.2s; }
    @media (prefers-color-scheme: light) {
      .term-bg { fill: #f8fafc; stroke: #e2e8f0; }
      .term-header-bar { fill: #f1f5f9; stroke: #e2e8f0; }
      .term-header-text { fill: #475569; }
      .key { fill: #0284c7; }
      .val-str { fill: #059669; }
      .val-bullet { fill: #334155; }
      .val-accent { fill: #7c3aed; }
      .comment { fill: #94a3b8; }
      .cmd { fill: #0f172a; }
      .output-text { fill: #64748b; }
      .sep-line { stroke: #e2e8f0; }
    }
  </style>

  <defs>
    <linearGradient id="term-border" x1="0" y1="0" x2="840" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Base -->
  <rect class="term-bg" x="1" y="1" width="838" height="373" rx="12" fill="#0d1117" stroke="url(#term-border)" stroke-width="1.5"/>

  <!-- Terminal Header Bar -->
  <rect class="term-header-bar" x="1" y="1" width="838" height="38" rx="12" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <rect class="term-header-bar" x="1" y="24" width="838" height="15" fill="#161b22"/>
  <line x1="1" y1="39" x2="839" y2="39" stroke="#21262d" stroke-width="1"/>

  <!-- Window Control Buttons (modern style) -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>

  <!-- Terminal Title -->
  <text class="term-header-text" x="420" y="24" text-anchor="middle">ardian@ai-workstation: ~/profile.yaml</text>

  <!-- Line 1: Comment -->
  <text class="code-text l1" x="28" y="72"><tspan class="comment"># Engineering intelligent, reliable, and scalable AI systems</tspan></text>

  <!-- Line 2: Developer Name -->
  <text class="code-text l2" x="28" y="96"><tspan class="key">developer:</tspan> <tspan class="val-str">"Ardian Nurcahya"</tspan></text>

  <!-- Line 3: Role -->
  <text class="code-text l3" x="28" y="120"><tspan class="key">primary_role:</tspan> <tspan class="val-str">"AI / ML Engineer &amp; MLOps Specialist"</tspan></text>

  <!-- Line 4: Core Pillars -->
  <text class="code-text l4" x="28" y="144"><tspan class="key">core_pillars:</tspan></text>

  <!-- Line 5: Bullet 1 -->
  <text class="code-text l5" x="48" y="168"><tspan class="val-accent">-</tspan> <tspan class="val-bullet">LLMs, Retrieval-Augmented Generation &amp; Autonomous Agents</tspan></text>

  <!-- Line 6: Bullet 2 -->
  <text class="code-text l6" x="48" y="192"><tspan class="val-accent">-</tspan> <tspan class="val-bullet">Computer Vision &amp; Deep Learning Architectures</tspan></text>

  <!-- Line 7: Bullet 3 -->
  <text class="code-text l7" x="48" y="216"><tspan class="val-accent">-</tspan> <tspan class="val-bullet">End-to-End MLOps, CI/CD, Containerization &amp; Serving</tspan></text>

  <!-- Line 8: Status -->
  <text class="code-text l8" x="28" y="244"><tspan class="key">status:</tspan> <tspan class="val-str">"Open to exciting roles &amp; high-impact AI collaborations 🚀"</tspan></text>

  <!-- Line 9: Separator -->
  <line class="sep-line l9" x1="28" y1="266" x2="810" y2="266" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Line 10: Interactive Command Line -->
  <text class="code-text l10" x="28" y="292"><tspan class="prompt">❯</tspan> <tspan class="path">~/ardian</tspan> <tspan class="cmd">git status</tspan></text>

  <!-- Line 11: Output Response -->
  <text class="code-text l11" x="28" y="316"><tspan class="output-text">  On branch main • Ready to deploy intelligence</tspan></text>

  <!-- Line 12: Active Prompt with Flow Cursor -->
  <text class="code-text l12" x="28" y="342"><tspan class="prompt">❯</tspan> <tspan class="cursor">▋</tspan></text>
</svg>
