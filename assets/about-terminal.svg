<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" fill="none" role="img" aria-labelledby="terminal-title terminal-desc">
  <title id="terminal-title">Ardian Nurcahya - Terminal Profile</title>
  <desc id="terminal-desc">Interactive developer terminal showing Ardian's profile, focus areas, and engineering background.</desc>
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fadeInLine {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .term-header-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #94a3b8;
    }
    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.5;
    }
    .key { fill: #38bdf8; font-weight: 600; }
    .val-str { fill: #34d399; }
    .val-bullet { fill: #cbd5e1; }
    .val-accent { fill: #a78bfa; }
    .comment { fill: #64748b; font-style: italic; }
    .prompt { fill: #f43f5e; font-weight: 700; }
    .path { fill: #38bdf8; }
    .cursor {
      fill: #38bdf8;
      animation: blink 1s infinite steps(2, start);
    }
    .l1 { animation: fadeInLine 0.4s ease-out forwards; animation-delay: 0.1s; }
    .l2 { animation: fadeInLine 0.4s ease-out forwards; animation-delay: 0.25s; }
    .l3 { animation: fadeInLine 0.4s ease-out forwards; animation-delay: 0.4s; }
    .l4 { animation: fadeInLine 0.4s ease-out forwards; animation-delay: 0.55s; }
    .l5 { animation: fadeInLine 0.4s ease-out forwards; animation-delay: 0.7s; }
    .l6 { animation: fadeInLine 0.4s ease-out forwards; animation-delay: 0.85s; }
    .l7 { animation: fadeInLine 0.4s ease-out forwards; animation-delay: 1.0s; }
    .l8 { animation: fadeInLine 0.4s ease-out forwards; animation-delay: 1.15s; }
    .l9 { animation: fadeInLine 0.4s ease-out forwards; animation-delay: 1.3s; }
    @media (prefers-color-scheme: light) {
      .term-bg { fill: #f8fafc; stroke: #e2e8f0; }
      .term-header-bar { fill: #f1f5f9; stroke: #e2e8f0; }
      .term-header-text { fill: #475569; }
      .key { fill: #0284c7; }
      .val-str { fill: #059669; }
      .val-bullet { fill: #334155; }
      .val-accent { fill: #7c3aed; }
      .comment { fill: #94a3b8; }
    }
  </style>

  <defs>
    <linearGradient id="term-border" x1="0" y1="0" x2="840" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Base -->
  <rect class="term-bg" x="1" y="1" width="838" height="308" rx="12" fill="#0d1117" stroke="url(#term-border)" stroke-width="1.5"/>

  <!-- Terminal Header Bar -->
  <rect class="term-header-bar" x="1" y="1" width="838" height="38" rx="12" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <!-- Hide bottom rounded corners of the header -->
  <rect class="term-header-bar" x="1" y="24" width="838" height="15" fill="#161b22"/>
  <line x1="1" y1="39" x2="839" y2="39" stroke="#21262d" stroke-width="1"/>

  <!-- Window Control Buttons (macOS style) -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>

  <!-- Terminal Title -->
  <text class="term-header-text" x="420" y="24" text-anchor="middle">ardian@ai-workstation: ~/profile.yaml</text>

  <!-- Terminal Code Content -->
  <g transform="translate(28, 68)" class="code-text">
    <!-- Line 1: Comment -->
    <g class="l1">
      <text x="0" y="0" class="comment"># Engineering intelligent, reliable, and scalable AI systems</text>
    </g>

    <!-- Line 2: Name -->
    <g class="l2">
      <text x="0" y="24"><tspan class="key">developer:</tspan> <tspan class="val-str">"Ardian Nurcahya"</tspan></text>
    </g>

    <!-- Line 3: Role -->
    <g class="l3">
      <text x="0" y="48"><tspan class="key">primary_role:</tspan> <tspan class="val-str">"AI / ML Engineer &amp; MLOps Specialist"</tspan></text>
    </g>

    <!-- Line 4: Core Pillars -->
    <g class="l4">
      <text x="0" y="72"><tspan class="key">core_pillars:</tspan></text>
    </g>

    <!-- Line 5: Bullet 1 -->
    <g class="l5">
      <text x="20" y="96"><tspan class="val-accent">-</tspan> <tspan class="val-bullet">LLMs, Retrieval-Augmented Generation &amp; Autonomous Agents</tspan></text>
    </g>

    <!-- Line 6: Bullet 2 -->
    <g class="l6">
      <text x="20" y="120"><tspan class="val-accent">-</tspan> <tspan class="val-bullet">Computer Vision &amp; Deep Learning Architectures</tspan></text>
    </g>

    <!-- Line 7: Bullet 3 -->
    <g class="l7">
      <text x="20" y="144"><tspan class="val-accent">-</tspan> <tspan class="val-bullet">End-to-End MLOps, CI/CD, Containerization &amp; Serving</tspan></text>
    </g>

    <!-- Line 8: Status -->
    <g class="l8">
      <text x="0" y="172"><tspan class="key">status:</tspan> <tspan class="val-str">"Open to exciting roles &amp; high-impact AI collaborations 🚀"</tspan></text>
    </g>

    <!-- Line 9: Interactive Command Prompt -->
    <g class="l9" transform="translate(0, 202)">
      <text x="0" y="0"><tspan class="prompt">❯</tspan> <tspan class="path">~/ardian</tspan> <tspan fill="#94a3b8">git status</tspan></text>
      <text x="0" y="20" class="comment">On branch main • Ready to deploy intelligence</text>
      <rect class="cursor" x="312" y="7" width="8" height="15" rx="1"/>
    </g>
  </g>
</svg>
