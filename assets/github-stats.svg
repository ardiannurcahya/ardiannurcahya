<svg xmlns="http://www.w3.org/2000/svg" width="410" height="215" viewBox="0 0 410 215" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">ardiannurcahya&apos;s GitHub Stats</title>
  <desc id="desc">GitHub activity and statistics calculated across public repositories.</desc>
  <style>
    .title { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #38bdf8; }
    .label { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #8b949e; }
    .value { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #f0f6fc; }
    .rank-badge { font: 800 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #38bdf8; }
    .text { font: 600 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #c9d1d9; }
    @media (prefers-color-scheme: light) {
      .card-bg { fill: #f8fafc; stroke: #e2e8f0; }
      .title { fill: #0284c7; }
      .label { fill: #64748b; }
      .value { fill: #0f172a; }
      .rank-badge { fill: #0284c7; }
      .text { fill: #1e293b; }
      .divider { stroke: #e2e8f0; }
      .pill-bg { fill: #f1f5f9; }
    }
  </style>

  <defs>
    <linearGradient id="card-border" x1="0" y1="0" x2="410" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect class="card-bg" x="1" y="1" width="408" height="213" rx="12" fill="#0d1117" stroke="url(#card-border)" stroke-width="1.5"/>

  <!-- Card Header -->
  <g transform="translate(22, 28)">
    <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
    <text x="18" y="10" class="title">ardiannurcahya&apos;s GitHub Stats</text>
  </g>

  <text x="24" y="68" class="label">Commits Indexed</text>
  <text x="180" y="68" text-anchor="end" class="value">830</text>
  <text x="215" y="68" class="label">Pull Requests</text>
  <text x="386" y="68" text-anchor="end" class="value">32</text>
  <text x="24" y="102" class="label">Public Repositories</text>
  <text x="180" y="102" text-anchor="end" class="value">47</text>
  <text x="215" y="102" class="label">Issues Opened</text>
  <text x="386" y="102" text-anchor="end" class="value">2</text>
  <text x="24" y="136" class="label">Stars Earned</text>
  <text x="180" y="136" text-anchor="end" class="value">156</text>
  <text x="215" y="136" class="label">Followers</text>
  <text x="386" y="136" text-anchor="end" class="value">12</text>
  <line class="divider" x1="24" y1="168" x2="386" y2="168" stroke="#21262d" stroke-width="1"/>
  <g transform="translate(24, 182)">
    <text y="14" class="label">Overall Activity Rank</text>
    <rect class="pill-bg" x="320" y="-3" width="42" height="24" rx="6" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="341" y="14" text-anchor="middle" class="rank-badge">B+</text>
  </g>
</svg>
