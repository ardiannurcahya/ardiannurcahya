<svg xmlns="http://www.w3.org/2000/svg" width="410" height="215" viewBox="0 0 410 215" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">activity-metrics</title>
  <desc id="desc">GitHub activity and statistics calculated across public repositories.</desc>
  <style>
    .window-title { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #86868b; }
    .label { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #a1a1a6; }
    .value { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #f5f5f7; }
    .rank-badge { font: 800 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #30d158; }
    .text { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #f5f5f7; }
    @media (prefers-color-scheme: light) {
      .win-bg { fill: #ffffff; stroke: #d1d5db; }
      .win-header { fill: #f3f4f6; stroke: #e5e7eb; }
      .window-title { fill: #4b5563; }
      .label { fill: #6b7280; }
      .value { fill: #111827; }
      .rank-badge { fill: #059669; }
      .text { fill: #111827; }
      .divider { stroke: #e5e7eb; }
      .pill-bg { fill: #f3f4f6; stroke: #e5e7eb; }
    }
  </style>

  <!-- Window Container -->
  <rect class="win-bg" x="1" y="1" width="408" height="213" rx="10" fill="#121319" stroke="#2d3139" stroke-width="1.5"/>

  <!-- Titlebar Header -->
  <path class="win-header" d="M 1 11 C 1 5.5 5.5 1 11 1 L 399 1 C 404.5 1 409 5.5 409 11 L 409 36 L 1 36 Z" fill="#1c1e26"/>
  <line class="divider" x1="1" y1="36" x2="409" y2="36" stroke="#262833" stroke-width="1"/>

  <!-- Control Dots -->
  <circle cx="18" cy="18" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.8"/>
  <circle cx="34" cy="18" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.8"/>
  <circle cx="50" cy="18" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.8"/>

  <!-- Centered Title -->
  <text class="window-title" x="205" y="22" text-anchor="middle">activity-metrics</text>

  <text x="24" y="68" class="label">Commits Indexed</text>
  <text x="180" y="68" text-anchor="end" class="value">854</text>
  <text x="215" y="68" class="label">Pull Requests</text>
  <text x="386" y="68" text-anchor="end" class="value">34</text>
  <text x="24" y="102" class="label">Public Repos</text>
  <text x="180" y="102" text-anchor="end" class="value">47</text>
  <text x="215" y="102" class="label">Issues Opened</text>
  <text x="386" y="102" text-anchor="end" class="value">2</text>
  <text x="24" y="136" class="label">Stars Earned</text>
  <text x="180" y="136" text-anchor="end" class="value">160</text>
  <text x="215" y="136" class="label">Followers</text>
  <text x="386" y="136" text-anchor="end" class="value">12</text>
  <line class="divider" x1="24" y1="168" x2="386" y2="168" stroke="#21242e" stroke-width="1"/>
  <g transform="translate(24, 182)">
    <text y="14" class="label">Activity Rank</text>
    <rect class="pill-bg" x="320" y="-3" width="42" height="24" rx="5" fill="#1b1e27" stroke="#2a2d3a"/>
    <text x="341" y="14" text-anchor="middle" class="rank-badge">B+</text>
  </g>
</svg>
