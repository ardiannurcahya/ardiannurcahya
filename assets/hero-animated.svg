<svg xmlns="http://www.w3.org/2000/svg" width="840" height="215" viewBox="0 0 840 215" fill="none" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Ardian Nurcahya - AI/ML Engineer Hero Banner</title>
  <desc id="hero-desc">Hero banner showcasing Ardian Nurcahya, AI and ML Engineer, MLOps Specialist and AI Product Developer.</desc>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.15); }
    }
    @keyframes subtleGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.2)); }
      50% { filter: drop-shadow(0 0 18px rgba(129, 140, 248, 0.35)); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #38bdf8;
      animation: subtleGlow 4s ease-in-out infinite;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #f0f6fc;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #8b949e;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #34d399;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .pulse-dot {
      transform-origin: 656px 38px;
      animation: pulse 2s ease-in-out infinite;
    }
    .chip-pill {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
      rx: 6;
    }
    @media (prefers-color-scheme: light) {
      .card-bg { fill: #f8fafc; stroke: #e2e8f0; }
      .title-text { fill: #0284c7; }
      .subtitle-text { fill: #0f172a; }
      .tagline-text { fill: #64748b; }
      .chip-pill { fill: #ffffff; stroke: #e2e8f0; }
      .chip-text { fill: #1e293b; }
      .status-pill { fill: #f1f5f9; stroke: #a7f3d0; }
      .status-text { fill: #059669; }
      .icon-box { fill: #ffffff; stroke: #e2e8f0; }
    }
  </style>

  <defs>
    <linearGradient id="hero-border" x1="0" y1="0" x2="840" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="icon-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Container Base (Uniform with tech-arsenal & about-terminal) -->
  <rect class="card-bg" x="1" y="1" width="838" height="213" rx="14" fill="#0d1117" stroke="url(#hero-border)" stroke-width="1.5"/>

  <!-- Live Status Badge (Top Right) -->
  <g id="status-group">
    <rect class="status-pill" x="640" y="24" width="168" height="28" rx="14" fill="#161b22" stroke="#059669" stroke-opacity="0.8" stroke-width="1"/>
    <circle class="pulse-dot" cx="656" cy="38" r="4" fill="#34d399"/>
    <text class="status-text" x="668" y="42">OPEN TO PROJECTS</text>
  </g>

  <!-- Left AI Node Avatar Box -->
  <g transform="translate(26, 26)">
    <rect class="icon-box" width="60" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- Neural Node Matrix Icon -->
    <circle cx="30" cy="30" r="16" fill="none" stroke="url(#icon-grad)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="30" cy="30" r="6" fill="url(#icon-grad)"/>
    <circle cx="30" cy="14" r="3" fill="#38bdf8"/>
    <circle cx="30" cy="46" r="3" fill="#38bdf8"/>
    <circle cx="14" cy="30" r="3" fill="#818cf8"/>
    <circle cx="46" cy="30" r="3" fill="#818cf8"/>
    <line x1="30" y1="17" x2="30" y2="24" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="30" y1="36" x2="30" y2="43" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="17" y1="30" x2="24" y2="30" stroke="#818cf8" stroke-width="1.2"/>
    <line x1="36" y1="30" x2="43" y2="30" stroke="#818cf8" stroke-width="1.2"/>
  </g>

  <!-- Main Titles & Bio Info -->
  <g transform="translate(104, 0)">
    <text class="title-text" x="0" y="58">Ardian Nurcahya</text>
    <text class="subtitle-text" x="0" y="86">AI/ML Engineer <tspan fill="#38bdf8">•</tspan> MLOps <tspan fill="#818cf8">•</tspan> AI Product Development</text>
    <text class="tagline-text" x="0" y="110">Engineering AI systems, autonomous agents, and computer vision pipelines.</text>
  </g>

  <!-- Quick Feature Chips Bar (Bottom) -->
  <g transform="translate(26, 148)">
    <!-- Chip 1: LLMs & Agents -->
    <g transform="translate(0, 0)">
      <rect class="chip-pill" width="168" height="32"/>
      <circle cx="14" cy="16" r="3.5" fill="#38bdf8"/>
      <text class="chip-text" x="24" y="20">LLMs &amp; AI Agents</text>
    </g>

    <!-- Chip 2: Computer Vision -->
    <g transform="translate(180, 0)">
      <rect class="chip-pill" width="160" height="32"/>
      <circle cx="14" cy="16" r="3.5" fill="#818cf8"/>
      <text class="chip-text" x="24" y="20">Computer Vision</text>
    </g>

    <!-- Chip 3: Production MLOps -->
    <g transform="translate(352, 0)">
      <rect class="chip-pill" width="168" height="32"/>
      <circle cx="14" cy="16" r="3.5" fill="#a78bfa"/>
      <text class="chip-text" x="24" y="20">Production MLOps</text>
    </g>

    <!-- Chip 4: Full-Stack AI -->
    <g transform="translate(532, 0)">
      <rect class="chip-pill" width="176" height="32"/>
      <circle cx="14" cy="16" r="3.5" fill="#34d399"/>
      <text class="chip-text" x="24" y="20">Full-Stack AI Platforms</text>
    </g>
  </g>
</svg>
