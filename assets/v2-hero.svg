<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" fill="none" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Ardian Nurcahya - Developer Profile</title>
  <desc id="hero-desc">Dark developer window showing Ardian Nurcahya's profile and engineering specs.</desc>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.2); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .window-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #86868b;
    }
    .mono-prompt {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      font-weight: 600;
    }
    .main-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #f5f5f7;
    }
    .main-role {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      fill: #30d158;
    }
    .main-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #a1a1a6;
    }
    .spec-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #e4e4e7;
    }
    .pulse-dot {
      transform-origin: 792px 18px;
      animation: pulse 2s ease-in-out infinite;
    }
    .cursor {
      fill: #30d158;
      animation: blink 1s infinite steps(2, start);
    }
    .pill {
      fill: #1a1c24;
      stroke: #2d303b;
      stroke-width: 1;
      rx: 5;
    }
    @media (prefers-color-scheme: light) {
      .win-bg { fill: #ffffff; stroke: #d1d5db; }
      .win-header { fill: #f3f4f6; stroke: #e5e7eb; }
      .window-title { fill: #4b5563; }
      .main-name { fill: #111827; }
      .main-role { fill: #059669; }
      .main-desc { fill: #4b5563; }
      .pill { fill: #f9fafb; stroke: #e5e7eb; }
      .spec-text { fill: #1f2937; }
      .divider { stroke: #e5e7eb; }
    }
  </style>

  <!-- Window Container -->
  <rect class="win-bg" x="1" y="1" width="838" height="228" rx="10" fill="#121319" stroke="#2d3139" stroke-width="1.5"/>

  <!-- Titlebar Header -->
  <path class="win-header" d="M 1 11 C 1 5.5 5.5 1 11 1 L 829 1 C 834.5 1 839 5.5 839 11 L 839 36 L 1 36 Z" fill="#1c1e26"/>
  <line class="divider" x1="1" y1="36" x2="839" y2="36" stroke="#262833" stroke-width="1"/>

  <!-- Control Dots -->
  <circle cx="20" cy="18" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.8"/>
  <circle cx="36" cy="18" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.8"/>
  <circle cx="52" cy="18" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.8"/>

  <!-- Window Title -->
  <text class="window-title" x="420" y="22" text-anchor="middle">ardian — developer profile</text>

  <!-- Top Right Status Badge -->
  <g transform="translate(670, 9)">
    <rect width="148" height="20" rx="10" fill="#08231a" stroke="#059669" stroke-width="1"/>
    <circle class="pulse-dot" cx="12" cy="10" r="3.5" fill="#30d158"/>
    <text font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#30d158" x="22" y="13.5">ONLINE • OPEN</text>
  </g>

  <!-- Terminal Content Body -->
  <g transform="translate(24, 60)">
    <!-- Prompt Line -->
    <text class="mono-prompt" x="0" y="0">
      <tspan fill="#30d158">ardian@workstation</tspan> <tspan fill="#86868b">~ $</tspan> <tspan fill="#f5f5f7">cat profile.json</tspan>
    </text>

    <!-- Main Identity -->
    <text class="main-name" x="0" y="34">Ardian Nurcahya</text>
    <text class="main-role" x="0" y="56">AI Systems Architect &amp; Agent Memory Engineer</text>
    <text class="main-desc" x="0" y="78">Engineering self-hosted knowledge graphs, autonomous agent memory, and low-latency model routing gateways.</text>
  </g>

  <!-- Bottom Specs / Features Bar -->
  <g transform="translate(24, 174)">
    <g transform="translate(0, 0)">
      <rect class="pill" width="220" height="30"/>
      <circle cx="12" cy="15" r="3.5" fill="#30d158"/>
      <text class="spec-text" x="24" y="19">Knowledge Graphs &amp; Memory</text>
    </g>
    <g transform="translate(230, 0)">
      <rect class="pill" width="268" height="30"/>
      <circle cx="12" cy="15" r="3.5" fill="#64d2ff"/>
      <text class="spec-text" x="24" y="19">Go • Python • TypeScript • SQL • Bash</text>
    </g>
    <g transform="translate(508, 0)">
      <rect class="pill" width="200" height="30"/>
      <circle cx="12" cy="15" r="3.5" fill="#ff9f0a"/>
      <text class="spec-text" x="24" y="19">K3s Clusters • Docker Ops</text>
    </g>
    <g transform="translate(718, 0)">
      <rect class="pill" width="74" height="30"/>
      <text class="spec-text" x="14" y="19"><tspan class="cursor">▋</tspan></text>
    </g>
  </g>
</svg>
